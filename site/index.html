<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>政局×マーケット日報</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@600;700;800&family=Oswald:wght@500;600&display=swap">
<style>
/* Layout: one trading-desk sheet per 回 (日付+時刻, 4回/日). Sticky rail picks the 回; then the audio
   console (fastest way in), then the numbers as ONE registry grouped by asset class — 日本/米国/為替/
   商品/暗号資産, so ドル円 lives in exactly one place — then the chart read, causes, news, policy, the
   slow-moving power structure, what to watch, dates, prose, the desk's own tools and link directory,
   sources. Dark-first: the desk's navy and gold. */
:root{
  --bg:#0A1128; --bg2:#0E1838; --surface:#121E45; --surface2:#19285A; --line:#283C76;
  --ink:#EEF2FA; --ink2:#B7C3E0; --ink3:#8696BD;
  --gold:#D4AF37; --gold-soft:#F0DFA0; --cyan:#00E5FF;
  --up:#FF8090; --down:#73B6FF; --warn:#FF5C77; --on-accent:#0A1128;
  --seat-g1:#D4AF37; --seat-g2:#F0DFA0; --seat-o1:#00E5FF; --seat-o2:#2FA9C4; --seat-o3:#A8EEF5;
  --seat-o4:#8FA3CC; --seat-o5:#5E6E99; --seat-o6:#C9D3EA; --seat-x:#3A4874; --on-seat:#0A1128;
  --f-display:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  --f-body:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;
  --f-num:'Oswald','Arial Narrow',Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EDF0F7; --bg2:#E2E7F2; --surface:#FBFCFE; --surface2:#F0F3FA; --line:#C7D0E5;
    --ink:#0A1128; --ink2:#3A4A73; --ink3:#5D6C94;
    --gold:#8A6808; --gold-soft:#A27C12; --cyan:#00697A;
    --up:#C2203A; --down:#1A5CC0; --warn:#C2203A; --on-accent:#FFFDF4;
    --seat-g1:#C9A227; --seat-g2:#E8D48F; --seat-o1:#22BFD6; --seat-o2:#2D97B0; --seat-o3:#A5E0E9;
    --seat-o4:#8FA3CC; --seat-o5:#6E7EA8; --seat-o6:#BCC7E0; --seat-x:#9BA6C2; --on-seat:#0A1128;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EDF0F7; --bg2:#E2E7F2; --surface:#FBFCFE; --surface2:#F0F3FA; --line:#C7D0E5;
  --ink:#0A1128; --ink2:#3A4A73; --ink3:#5D6C94;
  --gold:#8A6808; --gold-soft:#A27C12; --cyan:#00697A;
  --up:#C2203A; --down:#1A5CC0; --warn:#C2203A; --on-accent:#FFFDF4;
  --seat-g1:#C9A227; --seat-g2:#E8D48F; --seat-o1:#22BFD6; --seat-o2:#2D97B0; --seat-o3:#A5E0E9;
  --seat-o4:#8FA3CC; --seat-o5:#6E7EA8; --seat-o6:#BCC7E0; --seat-x:#9BA6C2; --on-seat:#0A1128;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
a{color:var(--cyan);text-underline-offset:3px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* ---- top rail ---- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin-inline:auto;padding-inline:20px;padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:baseline;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.02em;white-space:nowrap}
.brand span{font-size:11px;letter-spacing:.18em;color:var(--gold);font-weight:700;white-space:nowrap}
.datenav{display:flex;gap:6px;align-items:center}
.datenav button{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:40px;height:38px;cursor:pointer;font-size:16px}
.datenav button:disabled{opacity:.35;cursor:default}
.datenav button:not(:disabled):hover{border-color:var(--gold)}
.datenav select{background:var(--surface);border:1px solid var(--line);border-radius:8px;height:38px;padding-inline:10px;max-width:62vw;font-variant-numeric:tabular-nums}
.secnav{max-width:1120px;margin-inline:auto;padding-inline:20px;overflow-x:auto;scrollbar-width:none}
.secnav::-webkit-scrollbar{display:none}
.secnav ul{display:flex;gap:2px;padding-block:0 8px;white-space:nowrap}
.secnav a{display:block;padding:5px 12px;border-radius:999px;font-size:13px;color:var(--ink2);text-decoration:none;letter-spacing:.02em;transition:color .18s,background-color .18s}
.secnav a:hover{color:var(--ink);background:var(--surface)}
.secnav a[aria-current="true"]{color:var(--gold);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}

.wrap{max-width:1120px;margin-inline:auto;padding-inline:20px;padding-block:34px 88px;display:flex;flex-direction:column;gap:56px}
section{display:flex;flex-direction:column;gap:16px;scroll-margin-top:122px}
.sec-head{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px;background:linear-gradient(90deg,var(--gold),transparent) bottom left/92px 1px no-repeat}
.sec-head h2{font-family:var(--f-display);font-weight:700;font-size:25px;line-height:1.3;letter-spacing:.01em;text-wrap:balance}
.sec-head p{font-size:13px;color:var(--ink3)}

/* ---- masthead ---- */
.mast{gap:14px}
.mast-meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px;color:var(--ink2)}
.mast-date{font-family:var(--f-num);font-size:20px;letter-spacing:.04em;color:var(--gold);font-weight:600}
.badge{display:inline-block;padding:1px 10px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--gold);color:var(--gold)}
.badge.prov{border-color:var(--warn);color:var(--warn)}
.badge.slot{border-color:var(--cyan);color:var(--cyan)}
.mast h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5vw,46px);line-height:1.25;text-wrap:balance;max-width:22em}
.lede{font-size:16px;color:var(--ink2);max-width:44em}
.takes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.takes li{padding:14px 18px;display:flex;gap:12px;align-items:baseline;border-top:1px solid var(--line);margin-top:-1px;border-left:1px solid var(--line);margin-left:-1px;min-width:0}
.takes .n{font-family:var(--f-num);font-size:26px;line-height:1;color:var(--gold);font-weight:600}
.takes p{font-size:14px;line-height:1.6;min-width:0}
.notice{border:1px solid var(--warn);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--ink)}
.notice b{color:var(--warn)}

/* ---- audio console ---- */
.console{background:var(--surface);border:1px solid var(--line);border-radius:14px;border-top:3px solid var(--cyan);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.console .meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12.5px;color:var(--ink3);font-family:var(--f-num);letter-spacing:.03em}
.console h3{font-family:var(--f-display);font-size:clamp(18px,4vw,23px);line-height:1.4;font-weight:700;text-wrap:balance}
.console .sum{font-size:14px;color:var(--ink2)}
audio{width:100%;display:block}
.rates{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rates .lbl{font-size:12px;color:var(--ink3)}
button.rate{border:1px solid var(--line);background:transparent;border-radius:6px;padding:4px 11px;cursor:pointer;font-family:var(--f-num);font-size:12.5px}
button.rate:hover{border-color:var(--cyan)}
button.rate[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details.tr{border-top:1px solid var(--line);padding-top:10px}
details.tr summary{cursor:pointer;font-weight:700;font-size:14px}
.lines{display:flex;flex-direction:column;gap:10px;margin-top:12px;max-width:46em}
.ln{display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:10px}
.who{font-size:12px;font-weight:700;padding-top:4px}
.who.A{color:var(--gold)} .who.B{color:var(--cyan)}
.ln p{font-size:14.5px;line-height:1.8}

/* ---- market tiles ---- */
.grp{display:flex;flex-direction:column;gap:10px}
.grp-lab{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:12.5px;font-weight:700;letter-spacing:.12em;color:var(--cyan)}
.grp-lab span{font-size:11.5px;letter-spacing:0;font-weight:400;color:var(--ink3)}
.tiles{display:flex;flex-wrap:wrap;gap:12px}
.tile{flex:1 1 300px;min-width:0;background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.tile .lab{font-size:12.5px;font-weight:700;color:var(--gold);letter-spacing:.04em}
.tile .val{font-family:var(--f-num);font-weight:600;font-size:clamp(25px,6.4vw,36px);line-height:1.15;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 5px}
.tile .val span{white-space:nowrap}
.tile .val small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--ink2)}
@media (max-width:640px){.tile{flex-basis:150px;padding:12px 14px}}
.tile .chg{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.chg.up{color:var(--up)} .chg.down{color:var(--down)} .chg.flat{color:var(--ink2)}
.tile .asof{font-size:11.5px;color:var(--ink3)}
.tile .note{font-size:12.5px;color:var(--ink2);line-height:1.55}
.tile svg{display:block;width:100%;height:36px;margin-top:4px}

/* ---- cards / news ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{font-size:17px;line-height:1.45;font-weight:700;text-wrap:balance}
.card p{font-size:14px;color:var(--ink2)}
.kicker{font-size:11.5px;font-weight:700;letter-spacing:.12em;color:var(--cyan)}
.driver{border-top:3px solid var(--gold)}
.driver .no{font-family:var(--f-num);font-size:28px;line-height:1;color:var(--gold);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer;color:var(--ink2)}
.chip:hover{border-color:var(--gold);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-accent);font-weight:700}
.news{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.news li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 16px;padding:14px 18px;border-top:1px solid var(--line)}
.news li:first-child{border-top:none}
.news .cat{font-size:12px;font-weight:700;color:var(--gold);padding-top:3px}
.news .cat em{display:block;font-style:normal;font-size:11px;color:var(--ink3);font-weight:400}
.news h3{font-size:15.5px;line-height:1.5;font-weight:700}
.news p{font-size:13.5px;color:var(--ink2)}
.news .foot{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:4px;font-size:12px;color:var(--ink3)}
.pill{display:inline-block;border:1px solid var(--ink3);border-radius:4px;padding:0 7px;font-size:11.5px;font-weight:700;color:var(--ink2);line-height:1.7}
.pill.yen{border-color:var(--gold);color:var(--gold)} .pill.eq{border-color:var(--cyan);color:var(--cyan)}
@media (max-width:560px){.news li{grid-template-columns:minmax(0,1fr)}}

/* ---- movers ---- */
.boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.board{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.board h3{font-size:12.5px;font-weight:700;letter-spacing:.1em;color:var(--cyan)}
.board ol{display:flex;flex-direction:column;gap:6px}
.board li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:baseline;font-size:13.5px}
.board .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .nm b{font-family:var(--f-num);font-weight:600;letter-spacing:.03em;margin-right:6px}
.board .pc{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums}

/* ---- technical read ---- */
.tech-note{font-size:13px;color:var(--ink3);max-width:46em}
.tech-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.tq{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.tq-top{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;justify-content:space-between}
.tq-top .nm{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--gold)}
.tq-top .px{font-family:var(--f-num);font-weight:600;font-size:27px;line-height:1.1;font-variant-numeric:tabular-nums}
.tq .asof{font-size:11.5px;color:var(--ink3)}
.rng{display:flex;flex-direction:column;gap:7px}
.rng-lab{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;letter-spacing:.1em;font-weight:700;color:var(--ink3)}
.rng-track{position:relative;height:8px;border-radius:999px;background:var(--line)}
.rng-fill{position:absolute;inset-block:0;left:0;border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--gold))}
.rng-dot{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--bg)}
.rng-ends{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-num);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink2)}
.rng-meta{font-size:12.5px;color:var(--ink2);line-height:1.6}
.rng-meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.tfs{display:flex;flex-wrap:wrap;gap:8px}
.tf{display:flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:12.5px;background:var(--bg2)}
.tf b{font-weight:700}
.tf i{font-style:normal;font-weight:700}
.tf i.up{color:var(--up)} .tf i.down{color:var(--down)} .tf i.flat{color:var(--ink3)}
.ladder{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ladder li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:7px 13px;border-top:1px solid var(--line);font-size:13px}
.ladder li:first-child{border-top:none}
.ladder .lp{font-family:var(--f-num);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.ladder .ll{color:var(--ink2);min-width:0}
.ladder .lk{font-size:11px;letter-spacing:.08em;font-weight:700;color:var(--ink3);white-space:nowrap}
.ladder li.res .lp{color:var(--up)} .ladder li.res .lk{color:var(--up)}
.ladder li.sup .lp{color:var(--down)} .ladder li.sup .lk{color:var(--down)}
.ladder li.now{background:var(--gold);color:var(--on-accent)}
.ladder li.now .lp,.ladder li.now .ll,.ladder li.now .lk{color:var(--on-accent);font-weight:700}
.reads{display:flex;flex-direction:column;gap:4px;font-size:13px}
.reads li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;align-items:baseline}
.reads .rn{color:var(--ink3);min-width:0}
.reads .rv{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums}
.reads .rs{font-size:12px;color:var(--ink2)}
.tq .memo{font-size:13px;color:var(--ink2);line-height:1.65;padding-top:10px;border-top:1px solid var(--line)}

/* ---- tools ---- */
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.tool{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tool h3{font-family:var(--f-display);font-size:19px;font-weight:700;line-height:1.4}
.tool .hint{font-size:12.5px;color:var(--ink3);line-height:1.6}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:11.5px;letter-spacing:.06em;font-weight:700;color:var(--ink3)}
.fld input,.fld select{background:var(--bg2);border:1px solid var(--line);border-radius:8px;height:40px;padding-inline:11px;min-width:0;width:100%;font-variant-numeric:tabular-nums}
.fld input:focus,.fld select:focus{border-color:var(--cyan)}
.out{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.out-big{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.out-big .v{font-family:var(--f-num);font-weight:600;font-size:clamp(28px,6vw,38px);line-height:1.1;color:var(--gold);font-variant-numeric:tabular-nums}
.out-big .u{font-size:13px;color:var(--ink2)}
.out-rows{display:flex;flex-direction:column;gap:3px;font-size:13px}
.out-rows li{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:space-between}
.out-rows .k{color:var(--ink3)}
.out-rows .v{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums}
.warnline{font-size:12.5px;color:var(--warn);line-height:1.6}
.clock{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.clock li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:10px 13px;border-top:1px solid var(--line)}
.clock li:first-child{border-top:none}
.clock li.open{background:var(--bg2)}
.clock .cn{font-size:13px;font-weight:700;min-width:0}
.clock .ct{font-family:var(--f-num);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.clock .cs{font-size:11.5px;letter-spacing:.08em;font-weight:700;white-space:nowrap;color:var(--ink3)}
.clock li.open .cs{color:var(--cyan)}
.clock li.open .ct{color:var(--ink)}

/* ---- directory ---- */
.dir{display:flex;flex-direction:column;gap:26px}
.dir-grp{display:flex;flex-direction:column;gap:10px}
.dir-lab{display:flex;flex-wrap:wrap;gap:3px 12px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px}
.dir-lab b{font-size:12.5px;font-weight:700;letter-spacing:.12em;color:var(--cyan)}
.dir-lab span{font-size:12px;color:var(--ink3)}
.dir-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:8px 18px}
.dir-list li{display:flex;flex-direction:column;gap:1px;min-width:0;padding:7px 0}
.dir-list .t{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.dir-list .t.plain{color:var(--ink2)}
.dir-list .d{font-size:12.5px;color:var(--ink3);line-height:1.55}
.dir-list code{font-family:var(--f-num);font-size:12.5px;letter-spacing:.03em;color:var(--gold)}

/* ---- policy / structure ---- */
.rate-big{font-family:var(--f-num);font-weight:600;font-size:clamp(34px,6vw,52px);line-height:1.1;font-variant-numeric:tabular-nums}
.facts{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink2)}
.facts li{padding-left:14px;position:relative}

/* ---------- market history (shared by sparkline and the technical read) ---------- */
function histOf(id,upto){

/* ---------- technical read ----------

   actually stored — computed here from editions, never asserted; (2) the levels and indicator
   readings the 回 supplies in `technicals`. Neither states a direction to take. */
function rangeStat(pts){
  var lo=Infinity,hi=-Infinity;
  pts.forEach(function(p){lo=Math.min(lo,p.v);hi=Math.max(hi,p.v);});
  var cur=pts[pts.length-1].v, span=hi-lo;

    if(s===0)break;
    if(dirn===0)dirn=s; else if(s!==dirn)break;

/* mark the section the reader is in, on the rail */
var navLinks=[].slice.call(document.querySelectorAll('.secnav a'));
function watchSections(){
  if(st.obs){st.obs.disconnect(); st.obs=null;}
  if(typeof IntersectionObserver!=='function')return;
  var seen={};
  st.obs=new IntersectionObserver(function(entries){
    entries.forEach(function(e){seen[e.target.id]=e.isIntersecting?e.intersectionRatio:0;});
    var best='',bv=0;
    Object.keys(seen).forEach(function(k){if(seen[k]>bv){bv=seen[k];best=k;}});
    navLinks.forEach(function(a){a.setAttribute('aria-current',String(bv>0&&a.getAttribute('href')==='#'+best));});
  },{rootMargin:'-130px 0px -55% 0px',threshold:[0,.2,.6,1]});
  navLinks.forEach(function(a){
    var el=document.getElementById(a.getAttribute('href').slice(1));
    if(el) st.obs.observe(el);
  });
}

/* ---------- data ---------- */
function start(){
  var cl=window.claude;
  if(!cl||typeof cl.use!=='function'){st.db='nodb';render();return;}
  cl.use('db').then(function(db){
    if(!db){st.db='nodb';render();return;}
    try{
      db.collection('editions').orderBy('id','desc').limit(120).onSnapshot(function(snap){
        var list=[]; snap.docs.forEach(function(d){var x=d.data();
          if(x&&validDate(x.date)&&validSlot(x.slot)&&typeof x.headline==='string'){ if(!x.id)x.id=x.date+'-'+x.slot.replace(':',''); list.push(x); }});
        list.sort(function(a,b){return a.id<b.id?1:a.id>b.id?-1:0;});
        st.list=list; st.db='ready';
        if(st.picked&&!list.some(function(x){return x.id===st.picked;})) st.picked=null;
        render();
      },function(){st.db='error';render();});
      db.doc('structure/current').onSnapshot(function(snap){st.structure=snap.exists?snap.data():null; render();},function(){});
    }catch(e){st.db='error';render();}
  },function(){st.db='nodb';render();});
}
start();
